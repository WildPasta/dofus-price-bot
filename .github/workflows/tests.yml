name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # On Linux, pyautogui (via mouseinfo) installs the outdated python3-xlib
      # package while pynput installs python-xlib: both ship the Xlib module and
      # can overwrite each other. Reinstalling python-xlib last guarantees a
      # consistent Xlib module.
      - name: Fix duplicate Xlib install (Linux)
        if: runner.os == 'Linux'
        run: pip install --force-reinstall --no-deps python-xlib

      # The bot drives the mouse and reads the screen: use a virtual display on Linux
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v
